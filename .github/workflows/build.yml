name: Build router release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # 上游 nodex 主仓库更新时自动构建（自动更新功能）
  repository_dispatch:
    types: [upstream-updated]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 上游自动更新触发时：自动递增版本并打 tag（release 由后续 steps 创建）
      - name: Auto-tag on upstream update
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          LAST=$(git tag --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$LAST" ]; then LAST="0.0.0"; fi
          IFS='.' read -r MAJ MIN PAT <<< "$LAST"
          PAT=$((PAT + 1))
          NEW="v${MAJ}.${MIN}.${PAT}"
          # 同步更新 openwrt/Makefile 版本
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=$MAJ.$MIN.$PAT/" openwrt/Makefile
          git add openwrt/Makefile
          git commit -m "chore: bump to ${NEW} (upstream auto-update)" || true
          git tag "$NEW"
          git push origin main --tags
          echo "TAG=$NEW" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build nodex daemon binary
        run: |
          # 从主仓库拉取 Go 后端源码并编译（路由器版单二进制）
          git clone --depth 1 https://github.com/wooxi/nodex.git src
          cd src/webui
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          VERSION=${GITHUB_REF_NAME:-dev}
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VERSION" -o ../openwrt/files/nodex ./cmd/nodex

      - name: Install OpenWrt SDK
        run: |
          SDK_URL=https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          for i in 1 2 3; do
            wget -q --timeout=120 --tries=3 -O openwrt-sdk.tar.xz "$SDK_URL" && break
            echo "download failed (attempt $i), retrying..."
            sleep 10
          done
          ls -la openwrt-sdk.tar.xz
          tar xf openwrt-sdk.tar.xz
          mv openwrt-sdk-* sdk

      - name: Build ipk packages
        run: |
          mkdir -p sdk/package/nodex sdk/package/luci-app-nodex
          cp -r openwrt/* sdk/package/nodex/
          cp -r openwrt-luci/* sdk/package/luci-app-nodex/
          cd sdk
          make defconfig
          make package/nodex/compile V=s
          make package/luci-app-nodex/compile V=s

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp sdk/bin/packages/x86_64/*/nodex_*.ipk dist/ 2>/dev/null || true
          cp sdk/bin/packages/*/*/luci-app-nodex_*.ipk dist/ 2>/dev/null || true
          cp openwrt/files/nodex dist/nodex-linux-amd64
          # 内核二进制（与项目统一发布，供一键下载/更新）
          curl -sL -o dist/xray-linux-amd64 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip && \
            (cd dist && unzip -o -q xray-linux-amd64 xray && mv xray xray-linux-amd64 && rm -f xray-linux-amd64.zip || true)
          curl -sL -o dist/hysteria-linux-amd64 https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
          chmod +x dist/*-linux-amd64 2>/dev/null || true
          ls -la dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
