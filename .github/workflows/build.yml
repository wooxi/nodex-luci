name: Build router release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build nodex daemon binary
        run: |
          # 从主仓库拉取 Go 后端源码并编译（路由器版单二进制）
          git clone --depth 1 https://github.com/wooxi/nodex.git src
          cd src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o ../openwrt/files/nodex ./cmd/nodex

      - name: Install OpenWrt SDK
        run: |
          SDK_URL=https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          for i in 1 2 3; do
            wget -q --timeout=120 --tries=3 -O openwrt-sdk.tar.xz "$SDK_URL" && break
            echo "download failed (attempt $i), retrying..."
            sleep 10
          done
          ls -la openwrt-sdk.tar.xz
          tar xf openwrt-sdk.tar.xz
          mv openwrt-sdk-* sdk

      - name: Build ipk packages
        run: |
          mkdir -p sdk/package/nodex sdk/package/luci-app-nodex
          cp -r openwrt/* sdk/package/nodex/
          cp -r openwrt-luci/* sdk/package/luci-app-nodex/
          cd sdk
          make defconfig
          make package/nodex/compile V=s
          make package/luci-app-nodex/compile V=s

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp sdk/bin/packages/x86_64/*/nodex_*.ipk dist/ 2>/dev/null || true
          cp sdk/bin/packages/*/*/luci-app-nodex_*.ipk dist/ 2>/dev/null || true
          cp openwrt/files/nodex dist/nodex-linux-amd64
          # 内核二进制（与项目统一发布，供一键下载/更新）
          curl -sL -o dist/xray-linux-amd64 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip && \
            (cd dist && unzip -o -q xray-linux-amd64 xray && mv xray xray-linux-amd64 && rm -f xray-linux-amd64.zip || true)
          curl -sL -o dist/hysteria-linux-amd64 https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
          chmod +x dist/*-linux-amd64 2>/dev/null || true
          ls -la dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
